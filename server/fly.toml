# One OTP release serves the public Live HTTP/WebSocket endpoint and the
# private raw TCP protocol. Change the app name if it is unavailable.
app = "bibleit-server"
primary_region = "ams"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[build]
  dockerfile = "server/Dockerfile"

[env]
  BIBLEIT_SERVER_PORT = "7070"
  BIBLEIT_HTTP_PORT = "8080"
  BIBLEIT_HTTP_BIND_ADDRESS = "0.0.0.0"
  BIBLEIT_HTTP_SECURE_COOKIES = "true"
  BIBLEIT_DATA_DIR = "/data"
  BIBLEIT_PROXY_PROTOCOL = "false"
  BIBLEIT_SERVER_BIND_ADDRESS = "fly-local-6pn"
  BIBLEIT_SSH_PORT = "2222"

[[mounts]]
  source = "bibleit_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 22
    handlers = []
