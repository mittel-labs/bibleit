name: Python

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: Test on Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out source repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black requests textual textual-autocomplete unidecode build hatchling

      - name: Build and test local wheel install
        run: make install-local

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  build:
    name: Build distributions
    if: github.ref_type == 'tag'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out source repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential make

      - name: Install build tools
        run: python -m pip install --upgrade pip build cibuildwheel

      - name: Prepare native sources
        run: |
          rm -rf native/libbibleit
          mkdir -p native/libbibleit
          cp -R ../libbibleit/Makefile ../libbibleit/README.md ../libbibleit/include ../libbibleit/src native/libbibleit/

      - name: Build sdist
        if: runner.os == 'Linux'
        run: python -m build --sdist --outdir dist .

      - name: Build platform wheel
        run: python -m cibuildwheel --output-dir dist .
        env:
          CIBW_BUILD: cp311-*
          CIBW_SKIP: "*-win32 *-win_amd64 *-manylinux_i686 *-musllinux_*"
          CIBW_TEST_COMMAND: 'python -c "import bibleit._ffi as ffi; print(ffi._lib_name())"'

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: python/dist/*

  publish:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
