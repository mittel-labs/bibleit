<!doctype html>
<html lang="en" data-live="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ title }}</title>
  <style>
    html {
      touch-action: manipulation;
    }

    :root {
      color-scheme: light dark;
      --bg: #f7f3ea;
      --fg: #201c18;
      --muted: #756c61;
      --accent: #bf6b21;
      --button-bg: rgba(255, 255, 255, 0.7);
      --button-border: rgba(32, 28, 24, 0.16);
      --verse-scale: 1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151311;
        --fg: #f5efe6;
        --muted: #b7ab9e;
        --accent: #f3a65d;
        --button-bg: rgba(255, 255, 255, 0.08);
        --button-border: rgba(245, 239, 230, 0.18);
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f7f3ea;
      --fg: #201c18;
      --muted: #756c61;
      --accent: #bf6b21;
      --button-bg: rgba(255, 255, 255, 0.7);
      --button-border: rgba(32, 28, 24, 0.16);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #151311;
      --fg: #f5efe6;
      --muted: #b7ab9e;
      --accent: #f3a65d;
      --button-bg: rgba(255, 255, 255, 0.08);
      --button-border: rgba(245, 239, 230, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      touch-action: manipulation;
    }

    :root[data-presentation="true"] body {
      overflow: hidden;
    }

    main {
      min-height: 100vh;
      width: min(100%, 82rem);
      padding: clamp(1.5rem, 7vw, 4rem);
      display: grid;
      align-content: center;
      margin: 0 auto;
    }

    :root[data-presentation="true"] main {
      width: min(100%, 110rem);
      height: 100dvh;
      min-height: 100vh;
      padding: clamp(1.5rem, 7vw, 4rem);
      align-content: center;
      overflow: hidden;
    }

    [hidden] {
      display: none !important;
    }

    :root[data-live="false"] #font-size,
    :root[data-live="false"] #presentation,
    :root[data-live="false"] #history-toggle,
    :root[data-live="false"] .translation-filter,
    :root[data-live="false"] .verses,
    :root[data-live="false"] .status,
    :root[data-live="false"] .history-panel,
    :root[data-live="false"] .brand {
      display: none;
    }

    button {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      min-width: 2.75rem;
      height: 2.75rem;
      border: 1px solid var(--button-border);
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--fg);
      font: 700 1rem/1 ui-sans-serif, system-ui, sans-serif;
      z-index: 3;
    }

    #theme {
      right: max(1rem, env(safe-area-inset-right));
    }

    #font-size {
      right: calc(max(1rem, env(safe-area-inset-right)) + 3.25rem);
    }

    #presentation {
      left: calc(max(1rem, env(safe-area-inset-left)) + 3rem);
      right: auto;
    }

    .translation-filter {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: calc(max(1rem, env(safe-area-inset-right)) + 9.75rem);
      width: 2.75rem;
      color: var(--fg);
      font: 700 0.85rem/1.2 ui-sans-serif, system-ui, sans-serif;
      z-index: 2;
    }

    .translation-filter summary {
      width: 2.75rem;
      min-height: 2.75rem;
      border: 1px solid var(--button-border);
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      list-style: none;
      padding: 0;
      overflow: hidden;
    }

    .translation-filter summary::-webkit-details-marker {
      display: none;
    }

    .translation-filter summary::after {
      content: none;
    }

    .translation-icon {
      width: 1.3rem;
      height: 1.3rem;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 16;
    }

    .translation-filter[open] summary {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(191, 107, 33, 0.12);
    }

    .translation-options {
      position: absolute;
      top: calc(100% + 0.7rem);
      right: 0;
      width: 11rem;
      border: 1px solid var(--button-border);
      border-radius: 1rem;
      background: color-mix(in srgb, var(--bg) 92%, white);
      box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.14);
      padding: 0.45rem;
      display: grid;
      gap: 0.25rem;
    }

    .translation-options label {
    min-height: 2.4rem;
    padding: 0.45rem 0.8rem;
    border-radius: 0.75rem;
  }

    .translation-options label:hover {
      background: rgba(191, 107, 33, 0.12);
    }

    .translation-options input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .translation-options label:has(input:checked) {
      background: rgba(191, 107, 33, 0.16);
      color: var(--accent);
    }

    :root[data-presentation="true"] #presentation {
      border-color: var(--accent);
      color: var(--accent);
    }

    :root[data-filtered="true"] .translation-filter summary {
      border-color: var(--accent);
    }

    #history-toggle {
      right: calc(max(1rem, env(safe-area-inset-right)) + 6.5rem);
    }

    :root[data-history="true"] #history-toggle {
      border-color: var(--accent);
      color: var(--accent);
    }

    :root[data-has-history="false"] #history-toggle {
      display: none;
    }

    .translation {
      color: var(--accent);
      font: 700 0.78rem/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .reference {
      margin-top: 0.6rem;
      color: var(--muted);
      font: 700 clamp(1rem, 4vw, 1.35rem)/1.2 ui-sans-serif, system-ui, sans-serif;
    }

    .verse {
      margin-top: 1.2rem;
      font-size: clamp(2rem, 10vw, 4.5rem);
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .verses {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(22rem, 100%), 1fr));
      gap: clamp(1.5rem, 4vw, 3rem);
      align-items: start;
    }

    :root[data-presentation="true"] #font-size {
      display: none;
    }

    :root[data-presentation="true"] .translation-filter {
      right: calc(max(1rem, env(safe-area-inset-right)) + 6.5rem);
    }

    :root[data-presentation="true"] #history-toggle {
      right: calc(max(1rem, env(safe-area-inset-right)) + 3.25rem);
    }

    :root[data-presentation="true"] #theme {
      right: max(1rem, env(safe-area-inset-right));
    }

    :root[data-presentation="true"] .verses {
      margin-top: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(var(--visible-count), minmax(0, 1fr));
      gap: clamp(1rem, 2vh, 2rem);
      height: calc(100dvh - 8rem);
      overflow: hidden;
      align-items: stretch;
    }

    .verse-card {
      min-width: 0;
    }

    :root[data-presentation="true"] .verse-card {
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .verse-card .reference {
      margin-top: 0.5rem;
      font-size: clamp(1rem, 3vw, 1.25rem);
    }

    .verse-card .verse {
      font-size: clamp(
        calc(2rem * var(--verse-scale)),
        calc(7vw * var(--verse-scale)),
        calc(4.25rem * var(--verse-scale))
      );
    }

    :root[data-presentation="true"] .verse-card .verse {
      margin-top: 0.6rem;
      line-height: 1.04;
      overflow-wrap: break-word;
    }

    .status {
      margin-top: 2rem;
      color: var(--muted);
      font: 500 0.92rem/1.4 ui-sans-serif, system-ui, sans-serif;
    }

    .brand {
      margin-top: 0.6rem;
      color: var(--muted);
      font: 700 0.9rem/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    :root[data-presentation="true"] .status {
      display: none;
    }

    .history-panel {
      position: fixed;
      top: calc(max(1rem, env(safe-area-inset-top)) + 3.4rem);
      right: max(1rem, env(safe-area-inset-right));
      width: min(24rem, calc(100vw - 2rem));
      max-height: min(34rem, calc(100dvh - 6rem));
      z-index: 4;
      display: none;
      overflow: auto;
      border: 1px solid var(--button-border);
      border-radius: 1rem;
      padding: 0.55rem;
      background: color-mix(in srgb, var(--bg) 94%, white);
      box-shadow: 0 1.25rem 3rem rgba(0, 0, 0, 0.16);
    }

    :root[data-history="true"][data-live="true"] .history-panel {
      display: block;
    }

    .history-empty,
    .history-item {
      border-radius: 0.75rem;
      padding: 0.7rem 0.8rem;
      font: 700 0.9rem/1.35 ui-sans-serif, system-ui, sans-serif;
      color: var(--muted);
    }

    .history-item {
      width: 100%;
      position: static;
      top: auto;
      right: auto;
      min-width: 0;
      min-height: 0;
      height: auto;
      display: grid;
      gap: 0.25rem;
      border: 0;
      text-align: left;
      color: var(--fg);
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      white-space: normal;
    }

    .history-item:hover,
    .history-item:focus-visible {
      background: rgba(191, 107, 33, 0.12);
      outline: none;
    }

    .history-item .history-ref {
      color: var(--accent);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .history-item .history-text {
      color: var(--fg);
      display: -webkit-box;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      line-height: 1.25;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    :root[data-presentation="true"] .brand {
      position: fixed;
      left: max(1rem, env(safe-area-inset-left));
      bottom: max(1rem, env(safe-area-inset-bottom));
      margin-top: 0;
    }

    .splash {
      width: min(100%, 64rem);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: clamp(2rem, 7vw, 5rem);
      gap: 1.1rem;
      justify-items: start;
    }

    :root[data-live="true"] .splash {
      display: none;
    }

    .splash-copy {
      min-width: 0;
      display: grid;
      gap: 1.1rem;
      justify-items: start;
    }

    .splash-mark {
      width: clamp(3.5rem, 12vw, 4.5rem);
      height: clamp(3.5rem, 12vw, 4.5rem);
      display: grid;
      place-items: center;
      border: 1px solid var(--button-border);
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.38), transparent 38%),
        color-mix(in srgb, var(--button-bg) 80%, var(--accent));
      color: var(--accent);
      font: 800 clamp(1.8rem, 6vw, 2.25rem)/1 ui-sans-serif, system-ui, sans-serif;
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.12);
    }

    .splash-kicker {
      color: var(--accent);
      font: 800 0.8rem/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .splash h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(2.7rem, 11vw, 7rem);
      line-height: 0.92;
      letter-spacing: -0.02em;
    }

    .splash p {
      max-width: 38rem;
      margin: 0;
      color: var(--muted);
      font: 600 clamp(1rem, 3vw, 1.35rem)/1.45 ui-sans-serif, system-ui, sans-serif;
    }

    .splash-status {
      margin-top: 0.4rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--muted);
      font: 700 0.9rem/1 ui-sans-serif, system-ui, sans-serif;
    }

    .splash-status::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 0.35rem color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .splash-footer {
      margin-top: 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      font: 800 0.78rem/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .splash-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .splash-footer a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 0.2rem;
      border-radius: 0.2rem;
    }

    .splash-qr {
      display: grid;
      gap: 0.85rem;
      justify-items: center;
      padding: 1rem;
      border: 1px solid var(--button-border);
      border-radius: 1.5rem;
      background: color-mix(in srgb, var(--button-bg) 72%, var(--bg));
      color: var(--fg);
      text-decoration: none;
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.1);
    }

    .splash-qr:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--button-border));
    }

    .splash-qr span {
      color: var(--muted);
      font: 800 0.72rem/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .qr-code {
      width: clamp(5.5rem, 20vw, 20rem);
      height: auto;
      display: block;
      border-radius: 0.9rem;
    }

    .qr-code .qr-bg {
      fill: #fff;
    }

    .qr-code path {
      fill: #171411;
    }

    @media (max-width: 52rem) {
      #presentation {
        left: max(0.75rem, env(safe-area-inset-left));
        right: auto;
      }

      #theme {
        right: max(0.75rem, env(safe-area-inset-right));
      }

      #font-size {
        right: calc(max(0.75rem, env(safe-area-inset-right)) + 3.25rem);
      }

      .translation-filter {
        right: calc(max(0.75rem, env(safe-area-inset-right)) + 9.75rem);
      }

      #history-toggle {
        right: calc(max(0.75rem, env(safe-area-inset-right)) + 6.5rem);
      }

      :root[data-presentation="true"] .translation-filter {
        right: calc(max(0.75rem, env(safe-area-inset-right)) + 6.5rem);
      }

      :root[data-presentation="true"] #history-toggle {
        right: calc(max(0.75rem, env(safe-area-inset-right)) + 3.25rem);
      }

      main {
        min-height: 100svh;
        padding:
          max(4.75rem, env(safe-area-inset-top))
          1.5rem
          max(2.75rem, env(safe-area-inset-bottom));
        align-content: center;
      }

      .splash {
        width: 100%;
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .splash-qr {
        display: none;
      }

      .splash h1 {
        max-width: 9ch;
      }

      .splash p {
        font-size: 1.05rem;
      }

     :root[data-presentation="true"] main {
        height: 100svh;
        min-height: 100svh;
        padding:
          max(5.25rem, env(safe-area-inset-top))
          1rem
          max(5.5rem, env(safe-area-inset-bottom));
      }

     :root[data-presentation="true"] .verses {
        height: calc(100svh - 11rem);
        overflow: hidden;
      }

      :root[data-presentation="true"] .verse-card {
        min-height: 0;
        overflow: hidden;
      }

      :root[data-presentation="true"] .verse-card .verse {
        margin-top: 0.35rem;
        font-size: 1rem;
        line-height: 1.03;
        overflow-wrap: break-word;
      }

      :root[data-presentation="true"] .brand {
        display: block;
        left: max(1rem, env(safe-area-inset-left));
        bottom: max(1rem, env(safe-area-inset-bottom));
        font-size: 0.8rem;
      }
    }
  </style>
</head>

  <script>
    const verses = document.getElementById("verses");
    const status = document.getElementById("status");
    const fontSize = document.getElementById("font-size");
    const historyToggle = document.getElementById("history-toggle");
    const historyPanel = document.getElementById("history-panel");
    const presentation = document.getElementById("presentation");
    const translationFilter = document.getElementById("translation-filter");
    const translationFilterLabel = document.getElementById("translation-filter-label");
    const translationFilterOptions = document.getElementById("translation-filter-options");
    const theme = document.getElementById("theme");
    const live = document.getElementById("live");
    const splashStatus = document.getElementById("splash-status");
    let isLiveMode = false;
    let lastVerseData = null;
    let verseHistory = [];
    let selectedTranslations = loadSelectedTranslations();
    let presentationPreviousScaleIndex = null;
    let restorePresentationOnLive = localStorage.getItem("bibleit-presentation") === "true";
    let presentationFitFrame = null;
    let wakeLock = null;

    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      if (!isLiveMode || document.visibilityState !== "visible" || wakeLock) return;

      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => {
          wakeLock = null;
          if (isLiveMode && document.visibilityState === "visible") {
            setTimeout(requestWakeLock, 0);
          }
        });
      } catch (_error) {
        wakeLock = null;
      }
    }

    function releaseWakeLock() {
      if (!wakeLock) return;

      const lock = wakeLock;
      wakeLock = null;
      lock.release().catch(() => {});
    }

    function updateWakeLock() {
      if (isLiveMode && document.visibilityState === "visible") {
        requestWakeLock();
      } else {
        releaseWakeLock();
      }
    }

    function applyMode(isLive) {
      isLiveMode = Boolean(isLive);
      document.documentElement.dataset.live = isLiveMode ? "true" : "false";
      if (!isLive) {
        restorePresentationOnLive = false;
        setPresentationMode(false);
        verses.replaceChildren();
        translationFilterOptions.replaceChildren();
        translationFilter.hidden = true;
        status.textContent = "Waiting for presenter";
        splashStatus.textContent = "Waiting for presenter";
      } else if (lastVerseData) {
        if (restorePresentationOnLive) setPresentationMode(true, { persist: false });
        status.textContent = "Live";
        renderLiveVerses();
      } else {
        if (restorePresentationOnLive) setPresentationMode(true, { persist: false });
        status.textContent = "Live";
        splashStatus.textContent = "Live";
      }
      updateWakeLock();
    }

    function setTheme(value) {
      document.documentElement.dataset.theme = value;
      localStorage.setItem("bibleit-theme", value);
      theme.textContent = value === "dark" ? "☀" : "☾";
    }

    async function setPresentationMode(enabled, options = {}) {
      const persist = options.persist !== false;
      const value = enabled ? "true" : "false";
      document.documentElement.dataset.presentation = value;
      if (persist) {
        localStorage.setItem("bibleit-presentation", value);
        restorePresentationOnLive = enabled;
      }
      presentation.textContent = "▤";

      try {
        if (enabled && !document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }

        if (!enabled && document.fullscreenElement) {
          await document.exitFullscreen();
        }
      } catch (_error) {
        // Fullscreen is best-effort. Some mobile browsers may block it.
      }

      if (enabled) {
        if (presentationPreviousScaleIndex === null) {
          presentationPreviousScaleIndex = currentVerseScaleIndex();
        }
        setVerseScaleIndex(verseScales.length - 1, { persist: false });
      } else if (presentationPreviousScaleIndex !== null) {
        setVerseScaleIndex(presentationPreviousScaleIndex, { persist: false });
        presentationPreviousScaleIndex = null;
      }

      schedulePresentationFit();
    }

    function loadSelectedTranslations() {
      const stored = localStorage.getItem("bibleit-selected-translations");
      if (!stored) return null;

      try {
        const values = JSON.parse(stored);
        if (!Array.isArray(values) || !values.length) return null;
        return new Set(values.filter((value) => typeof value === "string" && value));
      } catch (_error) {
        return null;
      }
    }

    function saveSelectedTranslations(values, available) {
      if (!values.length || values.length === available.length) {
        selectedTranslations = null;
        localStorage.removeItem("bibleit-selected-translations");
      } else {
        selectedTranslations = new Set(values);
        localStorage.setItem("bibleit-selected-translations", JSON.stringify(values));
      }

      document.documentElement.dataset.filtered = selectedTranslations ? "true" : "false";
    }

    function availableTranslations(data) {
      return [...new Set(normalizeVerses(data).map((verse) => verse.translation || "bibleit"))];
    }

    function renderTranslationOption(value, label, checked) {
      const wrapper = document.createElement("label");
      const input = document.createElement("input");
      const text = document.createElement("span");

      input.type = "checkbox";
      input.value = value;
      input.checked = checked;
      text.textContent = label;

      wrapper.append(input, text);
      return wrapper;
    }

    function selectedTranslationValues() {
      return [...translationFilterOptions.querySelectorAll("input:checked")].map((input) => input.value);
    }

    function updateTranslationFilterLabel(available) {
      if (!selectedTranslations) {
        translationFilterLabel.ariaLabel = "All translations";
        translationFilterLabel.title = "All translations";
        return;
      }

      const selected = available.filter((translation) => selectedTranslations.has(translation));
      const label = selected.length ? `Selected translations: ${selected.join(", ")}` : "All translations";
      translationFilterLabel.ariaLabel = label;
      translationFilterLabel.title = label;
    }

    function updateTranslationFilterOptions(data) {
      const available = availableTranslations(data);
      const stillAvailable = selectedTranslations
        ? available.filter((translation) => selectedTranslations.has(translation))
        : available;

      if (selectedTranslations && !stillAvailable.length) {
        selectedTranslations = null;
        localStorage.removeItem("bibleit-selected-translations");
      }

      if (selectedTranslations && stillAvailable.length === available.length) {
        selectedTranslations = null;
        localStorage.removeItem("bibleit-selected-translations");
      }

      translationFilterOptions.replaceChildren(
        ...available.map((translation) =>
          renderTranslationOption(translation, translation, !selectedTranslations || selectedTranslations.has(translation))
        )
      );

      updateTranslationFilterLabel(available);
      translationFilter.hidden = available.length <= 1;
      document.documentElement.dataset.filtered = selectedTranslations ? "true" : "false";
    }

    const verseScales = [0.85, 1, 1.2, 1.4];

    function closestVerseScaleIndex(value) {
      const scale = Number.parseFloat(value);
      const safeScale = Number.isFinite(scale) ? scale : 1;
      return verseScales.reduce((bestIndex, candidate, index) => {
        const bestDistance = Math.abs(verseScales[bestIndex] - safeScale);
        const candidateDistance = Math.abs(candidate - safeScale);
        return candidateDistance < bestDistance ? index : bestIndex;
      }, 1);
    }

    function currentVerseScaleIndex() {
      const current = Number.parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--verse-scale")
      );
      return closestVerseScaleIndex(current);
    }

    function setVerseScaleIndex(index, options = {}) {
      const persist = options.persist !== false;
      const clampedIndex = Math.max(0, Math.min(index, verseScales.length - 1));
      const safeScale = verseScales[clampedIndex];
      document.documentElement.style.setProperty("--verse-scale", safeScale.toString());
      if (persist) localStorage.setItem("bibleit-verse-scale", safeScale.toString());
      const label = `Font size ${clampedIndex + 1}/${verseScales.length}`;
      fontSize.setAttribute("aria-label", label);
      fontSize.title = label;
      fontSize.textContent = clampedIndex === 0 ? "A" : `A${clampedIndex + 1}`;
      fitPresentationText();
    }

    function setVerseScale(value) {
      setVerseScaleIndex(closestVerseScaleIndex(value));
    }

    const savedTheme = localStorage.getItem("bibleit-theme");
    setTheme(savedTheme || "light");

    const savedVerseScale = localStorage.getItem("bibleit-verse-scale");
    setVerseScale(savedVerseScale || "1");

    document.documentElement.dataset.filtered = selectedTranslations ? "true" : "false";
    document.documentElement.dataset.live = "false";
    document.documentElement.dataset.hasHistory = "false";

    theme.addEventListener("click", () => {
      setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    historyToggle.addEventListener("click", () => {
      const enabled = document.documentElement.dataset.history !== "true";
      document.documentElement.dataset.history = enabled ? "true" : "false";
      renderHistory();
    });

    presentation.addEventListener("click", () => {
      const enabled = document.documentElement.dataset.presentation !== "true";
      setPresentationMode(enabled);
    });

    fontSize.addEventListener("click", () => {
      setVerseScaleIndex((currentVerseScaleIndex() + 1) % verseScales.length);
    });

    translationFilterOptions.addEventListener("change", () => {
      const available = availableTranslations(lastVerseData || {});
      const values = selectedTranslationValues();
      saveSelectedTranslations(values, available);
      updateTranslationFilterLabel(available);
      renderLiveVerses();
    });

    function normalizeVerses(data) {
      if (Array.isArray(data.translations) && data.translations.length) return data.translations;
      return data.text ? [data] : [];
    }

    function verseHistoryKey(data) {
      return normalizeVerses(data)
        .map((verse) => [
          verse.translation || "bibleit",
          verse.book || "",
          verse.chapter || "",
          verse.verse || "",
        ].join(":"))
        .join("|");
    }

    function verseHistoryReference(verse) {
      const translation = verse.translation || "bibleit";
      const reference = verse.reference || [verse.book, `${verse.chapter}:${verse.verse}`].filter(Boolean).join(" ");
      return `${translation} · ${reference}`;
    }

    function recordHistory(data) {
      const key = verseHistoryKey(data);
      if (!key) return;

      verseHistory = verseHistory.filter((entry) => entry.key !== key);
      verseHistory.unshift({ key, data });
      verseHistory = verseHistory.slice(0, 24);
      renderHistory();
    }

    function renderHistory() {
      if (!verseHistory.length) {
        document.documentElement.dataset.hasHistory = "false";
        document.documentElement.dataset.history = "false";
        historyPanel.replaceChildren();
        return;
      }

      document.documentElement.dataset.hasHistory = "true";
      historyPanel.replaceChildren(
        ...verseHistory.map((entry) => {
          const primary = normalizeVerses(entry.data)[0] || {};
          const button = document.createElement("button");
          const reference = document.createElement("span");
          const text = document.createElement("span");

          button.type = "button";
          button.className = "history-item";
          reference.className = "history-ref";
          text.className = "history-text";
          reference.textContent = verseHistoryReference(primary);
          text.textContent = primary.text || "";

          button.append(reference, text);
          button.addEventListener("click", () => {
            document.documentElement.dataset.history = "false";
            showVerse(entry.data, "History");
          });

          return button;
        })
      );
    }

    function visibleVerses(data) {
      const normalized = normalizeVerses(data);
      updateTranslationFilterOptions(data);

      if (!selectedTranslations) return normalized;

      const filtered = normalized.filter((verse) => selectedTranslations.has(verse.translation || "bibleit"));

      if (filtered.length) return filtered;

      selectedTranslations = null;
      localStorage.removeItem("bibleit-selected-translations");
      return normalized;
    }

    function renderVerseCard(data) {
      const card = document.createElement("section");
      card.className = "verse-card";

      const translation = document.createElement("div");
      translation.className = "translation";
      translation.textContent = data.translation || "bibleit";

      const reference = document.createElement("div");
      reference.className = "reference";
      reference.textContent = data.reference || "";

      const verse = document.createElement("div");
      verse.className = "verse";
      verse.textContent = data.text || "";

      card.append(translation, reference, verse);
      return card;
    }

    function fitPresentationText() {
      const verseText = [...document.querySelectorAll(".verse-card .verse")];

      verseText.forEach((element) => {
        element.style.fontSize = "";
      });

      if (document.documentElement.dataset.presentation !== "true") return;

      requestAnimationFrame(() => {
        const cards = [...document.querySelectorAll(".verse-card")];

        cards.forEach((card) => {
          const verse = card.querySelector(".verse");
          if (!verse) return;

          let low = 6;
          let high = window.innerWidth <= 600 ? 42 : 120;

          const fits = () =>
            card.scrollHeight <= card.clientHeight + 1 &&
            verses.scrollHeight <= verses.clientHeight + 1;

          for (let i = 0; i < 24; i += 1) {
            const mid = (low + high) / 2;
            verse.style.fontSize = `${mid}px`;

            if (fits()) {
              low = mid;
            } else {
              high = mid;
            }
          }

          verse.style.fontSize = `${low}px`;
        });
      });
    }

    function schedulePresentationFit() {
      if (presentationFitFrame !== null) {
        cancelAnimationFrame(presentationFitFrame);
      }

      presentationFitFrame = requestAnimationFrame(() => {
        presentationFitFrame = null;
        fitPresentationText();
        setTimeout(fitPresentationText, 80);
        setTimeout(fitPresentationText, 250);
      });
    }

    function showVerse(data, label) {
      lastVerseData = data;
      if (isLiveMode) {
        renderLiveVerses();
        status.textContent = label;
      }
    }

    function applyVerse(data) {
      if (data.history === true) {
        recordHistory(data);
      }

      showVerse(data, "Live");
    }

    function renderLiveVerses() {
      const renderedVerses = visibleVerses(lastVerseData || {});
      document.documentElement.style.setProperty("--visible-count", Math.max(renderedVerses.length, 1).toString());
      verses.replaceChildren(...renderedVerses.map(renderVerseCard));
      schedulePresentationFit();
    }

    window.addEventListener("resize", schedulePresentationFit);
    window.addEventListener("orientationchange", schedulePresentationFit);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", schedulePresentationFit);
    }
    document.addEventListener("visibilitychange", updateWakeLock);

    if (document.fonts) {
      document.fonts.ready.then(schedulePresentationFit);
    }

    function connect() {
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      const socket = new WebSocket(`${scheme}://${location.host}/ws`);

      socket.addEventListener("open", () => {
        status.textContent = "Connected";
        splashStatus.textContent = "Connected";
      });

      socket.addEventListener("message", (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "mode") applyMode(message.live);
        if (message.type === "verse") applyVerse(message.verse);
      });

      socket.addEventListener("close", () => {
        status.textContent = "Reconnecting...";
        splashStatus.textContent = "Reconnecting...";
        setTimeout(connect, 1000);
      });
    }

    connect();
    renderHistory();
    
    document.addEventListener("click", (event) => {
      if (!translationFilter.contains(event.target)) {
        translationFilter.removeAttribute("open");
      }

      if (!historyPanel.contains(event.target) && event.target !== historyToggle) {
        document.documentElement.dataset.history = "false";
      }
    });
  </script>
</body>
</html>
