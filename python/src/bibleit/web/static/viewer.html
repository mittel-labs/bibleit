<!doctype html>
<html lang="en" data-live="false" data-room="{{ room }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ title }}</title>
  <link rel="icon" type="image/png" href="/bibleit-icon.png">
  <link rel="apple-touch-icon" href="/bibleit-icon.png">
  <link rel="stylesheet" href="/viewer.css">
</head>
<body>
  <main id="live">
    <section id="splash" class="splash" aria-live="polite">
      <div class="splash-copy">
        <img class="splash-mark" src="/bibleit-icon.png" alt="bibleit">
        <div class="splash-kicker">bibleit live</div>
        <h1>Live is coming soon</h1>
        <p>Waiting for the presenter to start sharing the current verse.</p>
        <div id="splash-status" class="splash-status">Connecting</div>
        <div class="splash-footer">by <a href="https://mittel.site" rel="noreferrer">Mittel</a></div>
      </div>
      <a id="splash-qr" class="splash-qr" href="/" rel="noreferrer"
         aria-label="Enlarge the QR code for this page" aria-haspopup="dialog">
        <img class="qr-code" src="/qr.svg" alt="" width="1000" height="1000">
        <span>Scan to open</span>
      </a>
      <div id="qr-dialog" class="qr-dialog" role="dialog" aria-modal="true" aria-label="Large bibleit live QR code" hidden>
        <div class="qr-dialog-card">
          <button id="qr-dialog-close" class="qr-dialog-close" type="button" aria-label="Close QR code">&times;</button>
          <div id="qr-dialog-code" class="qr-dialog-code" aria-hidden="true"></div>
          <div class="qr-dialog-label">Scan to open bibleit live</div>
          <a class="qr-dialog-url" href="https://live.bibleit.app" rel="noreferrer">live.bibleit.app</a>
        </div>
      </div>
    </section>
    <button id="font-size" type="button" aria-label="Change verse font size" title="Change verse font size">A</button>
    <button id="history-toggle" type="button" aria-label="Show verse history" title="Show verse history">☷</button>
    <button id="presentation" type="button" aria-label="Toggle presentation mode" title="Toggle presentation mode">⛶</button>
    <details id="translation-filter" class="translation-filter">
      <summary id="translation-filter-label" aria-label="All translations" title="All translations">
        <svg class="translation-icon" viewBox="0 0 256 256" aria-hidden="true">
          <path d="M128,88a32,32,0,0,1,32-32h72V200H160a32,32,0,0,0-32,32"></path>
          <path d="M24,200H96a32,32,0,0,1,32,32V88A32,32,0,0,0,96,56H24Z"></path>
          <line x1="160" y1="96" x2="200" y2="96"></line>
          <line x1="160" y1="128" x2="200" y2="128"></line>
          <line x1="160" y1="160" x2="200" y2="160"></line>
        </svg>
      </summary>
      <div id="translation-filter-options" class="translation-options"></div>
    </details>
    <button id="theme" type="button" aria-label="Toggle color theme" title="Toggle color theme">◐</button>
    <div class="verses" id="verses"></div>
    <div class="status" id="status">Connected viewers follow the active verse automatically.</div>
    <div class="brand"><img class="brand-mark" src="/bibleit-icon.png" alt="">bibleit</div>
    <div id="history-panel" class="history-panel" aria-label="Verse history"></div>
  </main>
  <script type="module" src="/viewer.js"></script>
</body>
</html>
